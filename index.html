<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForCluster21MyBelovedReader</title>
<style>
:root{--bg:#100d1c;--panel:#1b1630;--panel2:#251d40;--text:#f5f1ff;--muted:#b8afcf;--accent:#c5a3ff;--accent2:#ff9bcf;--border:#40345d}
body.light{--bg:#f6f1ff;--panel:#fff;--panel2:#eee5ff;--text:#211632;--muted:#665a7d;--accent:#7543c8;--accent2:#c13e87;--border:#d8c9ef}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#30204b 0,transparent 38%),var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;line-height:1.6}
header{padding:24px 5%;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{font-weight:900;letter-spacing:.4px;font-size:clamp(1.15rem,3vw,1.7rem)}.brand span{color:var(--accent2)}
button,input,select{font:inherit}button{cursor:pointer;border:1px solid var(--border);border-radius:12px;padding:10px 14px;background:var(--panel2);color:var(--text);font-weight:700}button:hover{border-color:var(--accent)}.primary{background:linear-gradient(120deg,#8558d7,#c34d9b);color:white;border:0}
main{max-width:1180px;margin:auto;padding:28px 5% 60px}.hero{padding:28px 0 22px}.eyebrow{color:var(--accent2);font-size:.8rem;font-weight:800;letter-spacing:2px;text-transform:uppercase}h1{font-size:clamp(2rem,6vw,3.5rem);line-height:1.1;margin:8px 0 12px}.muted{color:var(--muted)}.tools{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 26px}.tools input{flex:1;min-width:180px}.tools input,.tools select{background:var(--panel);color:var(--text);border:1px solid var(--border);border-radius:12px;padding:11px}
.section-title{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin:18px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:17px}.card{background:var(--panel);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 10px 35px #0002}.cover{height:175px;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:900;background:linear-gradient(135deg,#302253,#8a4f9f 55%,#e18bb4);position:relative}.cover:after{content:"";position:absolute;inset:12px;border:1px solid #ffffff55;border-radius:10px}.cover span{z-index:1;text-shadow:0 4px 14px #0008}.cardbody{padding:16px}.tag{display:inline-block;color:var(--accent);font-size:.76rem;font-weight:800;margin-bottom:4px}.card h3{margin:2px 0 5px}.card p{margin:0 0 12px;color:var(--muted);font-size:.92rem}.card .actions{display:flex;gap:8px;flex-wrap:wrap}.card .actions button{flex:1}
.reader{display:none;margin-top:28px;background:var(--panel);border:1px solid var(--border);border-radius:20px;padding:clamp(16px,4vw,30px)}.reader.active{display:block}.readerhead{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;flex-wrap:wrap}.reader h2{margin:4px 0}.chapter-controls{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:18px 0}.chapter-controls select{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:10px;padding:10px;max-width:100%}.story{max-width:760px;margin:22px auto;font-family:Georgia,serif;font-size:1.12rem;line-height:1.95;white-space:pre-line}.story p{margin:0 0 1.25em}.readerfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:16px}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--panel);border-radius:16px}footer{text-align:center;padding:25px;color:var(--muted);border-top:1px solid var(--border);font-size:.9rem}
@media(max-width:520px){header{padding:18px 5%}.cover{height:150px}.chapter-controls button{flex:1}.chapter-controls select{width:100%}}
</style>
</head>
<body>
<header><div class="brand">ForCluster<span>21</span>MyBelovedReader</div><button id="themeBtn" aria-label="Toggle theme">☀️ Light mode</button></header>
<main>
<section class="hero"><div class="eyebrow">Your next favorite story awaits</div><h1>Enter a world<br>between the pages.</h1><p class="muted">Discover stories, choose a chapter, and keep reading at your own pace.</p></section>
<div class="tools"><input id="search" type="search" placeholder="Search novels or descriptions…"><select id="genre"><option value="All">All genres</option><option>Romance</option><option>Fantasy</option><option>Action</option><option>Drama</option><option>Comedy</option><option>Adventure</option><option>Horror</option><option>Mystery</option></select></div>
<div class="section-title"><h2>Novel Library</h2><span class="muted" id="count"></span></div>
<div class="grid" id="novels"></div>
<section class="reader" id="reader" aria-live="polite">
<div class="readerhead"><div><div class="eyebrow" id="readerGenre"></div><h2 id="readerTitle">Novel title</h2><div class="muted" id="readerSubtitle"></div></div><button id="closeReader">✕ Close reader</button></div>
<div class="chapter-controls"><label for="chapterSelect">Choose chapter:</label><select id="chapterSelect"></select><button id="prevTop">← Previous</button><button class="primary" id="nextTop">Next chapter →</button></div>
<div class="story" id="storyText"></div>
<div class="readerfoot"><span class="muted" id="chapterStatus"></span><div class="chapter-controls" style="margin:0"><button id="prevBottom">← Previous chapter</button><button class="primary" id="nextBottom">Next chapter →</button></div></div>
</section>
</main>
<footer>Made for readers and future storytellers. Replace the demo stories with your own original chapters.</footer>
<script>
const novels = [
{ id:"moonlit", title:"The Moonlit Promise", genre:"Romance", symbol:"☾", desc:"Two classmates, one quiet promise, and feelings neither knows how to confess.", chapters:[
["Chapter 1: A Seat by the Window",`Mira always chose the seat beside the classroom window. From there, she could watch the rain slide down the glass and pretend the world was quieter than it really was.\n\nOn the first day of the new semester, a boy named Eli took the seat beside her. He offered a small smile and asked if the empty chair was taken.\n\n“No,” Mira answered, returning to her notebook.\n\nEli did not know it yet, but that one ordinary morning would become the memory he returned to whenever life felt difficult.`],
["Chapter 2: The Umbrella",`The rain came hard after class. Mira stood beneath the school entrance, watching students hurry into the gray afternoon.\n\nEli appeared beside her and opened a navy umbrella. “We can share it,” he said, trying to sound casual.\n\nTheir shoulders brushed as they walked. Neither spoke much, but when Mira laughed at a puddle splashing her shoes, Eli found himself wishing the walk were longer.\n\nAt her gate, she thanked him. He walked away in the rain with a warm feeling he could not explain.`],
["Chapter 3: Almost a Confession",`Eli typed a message, erased it, and typed it again. The words were simple: I think I like you.\n\nIn the end, he sent a picture of the sunset instead. Mira replied with a heart and a comment about the colors.\n\nIt was not the answer he hoped for, but he smiled anyway. For now, he would keep showing up—not because she owed him love, but because he was learning how to be honest with his own heart.`]]},
{ id:"ember", title:"Was Never in Her Heart", genre:"Fantasy", symbol:"♜", desc:"A quiet village girl discovers a fire sleeping beneath her skin.", chapters:[
["Chapter 1:The story starts when the guy begins falling for the girl. At first, he thought it was nothing, but as time went on, he realized his feelings for her were real. The problem was that he couldn't confess to her directly. So instead, he expressed his feelings through quotes and emotional lines (hugot) in the group chat—hoping she would realize those words were meant for her.”`],
{ id:"last", title:"The Last Vanguard", genre:"Action", symbol:"⚔", desc:"An exiled fighter returns when the city loses its defenders.", chapters:[
["Chapter 1: Sirens at Midnight",`The warning sirens split the night. On the rooftops, Kade watched the city lights flicker out one district at a time.\n\nHe had sworn never to fight for the Vanguard again. Their commander had betrayed his team, and the city had blamed him for the disaster.\n\nBut when he saw children trapped beneath a collapsed skybridge, his promise broke before he could think. He leapt into the smoke.`],
["Chapter 2: A Familiar Signal",`The rescue beacon flashed three times—the old Vanguard distress code. Someone inside the ruined station knew Kade was nearby.\n\nHe found a cracked communicator under a fallen beam. A voice crackled through it: “Kade, if you're hearing this, the attack is only the beginning.”\n\nHe tightened the strap on his glove. Someone wanted him back in the war.`],
["Chapter 3: No Turning Back",`At the station entrance, armored drones rose from the darkness. Kade counted six, then seven.\n\nHe had no squad, no backup, and one half-charged blade. He smiled without humor.\n\n“Fine,” he muttered. “Let's start small.”`]]},
{ id:"rain", title:"When the Rain Remembers", genre:"Drama", symbol:"☂", desc:"A daughter returns home to understand the silence her father left behind.", chapters:[
["Chapter 1: The Locked Room",`The house smelled of cedar and old books. After the funeral, Hana returned to the room her father had kept locked for years.\n\nInside were no treasures, only letters tied with blue thread. Every envelope carried her name, written in the same careful handwriting.\n\nThe first letter began: “If you're reading this, I was too afraid to tell you the truth while I was alive.”`],
["Chapter 2: Blue Thread",`Hana read until the afternoon faded. The letters described missed birthdays, quiet sacrifices, and a mistake her father had carried alone.\n\nShe had mistaken his silence for indifference. Now each page made that certainty feel fragile.\n\nOutside, rain began to tap against the roof. Hana held the final letter against her chest and let herself cry.`],
["Chapter 3: The Things We Keep",`At the river, Hana scattered the dried flowers her father had saved. She did not forgive everything in one moment; grief was not so simple.\n\nBut she finally understood that love could be imperfect and still be real. She returned home, opened the curtains, and let the light enter the room.`]]},
{ id:"chaos", title:"Roommates of Chaos", genre:"Comedy", symbol:"☕", desc:"Three disastrous roommates try to survive college without burning the kitchen.", chapters:[
["Chapter 1: The Great Noodle Incident",`At 2:13 a.m., the smoke alarm began to scream. Jun stood in the kitchen holding a pot of noodles that looked suspiciously like a science experiment.\n\n“Why is it purple?” Mina asked.\n\n“Creative cooking,” Jun replied.\n\nTheir third roommate, Theo, entered wearing a bicycle helmet. “I heard an explosion. Is the rent still due if the apartment is haunted?”`],
["Chapter 2: The Chore Chart",`Mina created a chore chart with color-coded boxes and a strict penalty system. By lunchtime, Jun had drawn a mustache on his assigned square, and Theo had traded bathroom duty for two dumplings and a pencil.\n\nMina stared at them. “I live with toddlers.”\n\n“Independent toddlers,” Theo corrected, before immediately asking where the clean spoons were.`],
["Chapter 3: Inspection Day",`The landlord arrived early. The apartment was spotless except for one suspicious smell coming from the fridge.\n\nJun opened it. A container hissed.\n\nNobody moved.\n\nThe landlord slowly took out his phone. Mina smiled brightly. “Welcome to our very experimental home.”`]]},
{ id:"wild", title:"Beyond the Wild Map", genre:"Adventure", symbol:"⌖", desc:"A lost map leads a fearless trio into a jungle no compass can explain.", chapters:[
["Chapter 1: The Map in the Bottle",`Nico found the bottle caught between two rocks on the beach. Inside was a map drawn on material that felt like cloth but shimmered like water.\n\nHis friends, Bea and Tomas, agreed to investigate after exactly eleven minutes of arguing.\n\nThe map showed an island that did not appear on any modern chart. At its center was a simple mark: a black star.`],
["Chapter 2: The Green Wall",`The jungle swallowed their footsteps. Vines twisted around trees taller than buildings, and colorful birds watched from branches without making a sound.\n\nBea noticed the compass spinning. Tomas noticed the path behind them had vanished.\n\nNico folded the map carefully. “Then we go forward.”`],
["Chapter 3: The Hidden River",`They heard the river before they saw it. It flowed uphill through a canyon of smooth black stone, carrying tiny lights beneath its surface.\n\nAt the water's edge, the map warmed in Nico's hands. The black star had begun to glow.\n\nWhatever they were searching for had found them first.`]]},
{ id:"hollow", title:"The Hollow House", genre:"Horror", symbol:"☠", desc:"Every night, a locked upstairs door opens a little wider.", chapters:[
["Chapter 1: Three Knocks",`The house was cheap because nobody stayed long. On the first night, Sam heard three knocks from the locked room upstairs.\n\nHe checked the hallway. Empty.\n\nThe next night, the knocks came again—three slow taps, followed by the sound of a key turning on the other side of the door.\n\nSam had been given no key. He was beginning to suspect that someone else had one.`],
["Chapter 2: The Gap",`By Friday, the door stood open a finger's width. Cold air slipped through the gap, carrying the smell of wet soil.\n\nSam pushed it shut and wedged a chair beneath the handle. At 3:03 a.m., the chair scraped across the floor.\n\nFrom the darkness came a whisper: “You took your time.”`],
["Chapter 3: The Name on the Wall",`The room was empty except for a mirror and a name carved into the plaster: SAM.\n\nHe backed toward the hall. In the mirror, his reflection remained still.\n\nThen it lifted one hand and pointed behind him.`]]},
{ id:"cipher", title:"The Silent Cipher", genre:"Mystery", symbol:"⌕", desc:"A student detective finds a code hidden in ordinary library books.", chapters:[
["Chapter 1: The Wrong Page",`Ari returned a library book and found a sentence underlined in pencil. The marks looked random until she noticed the page numbers formed a date.\n\nAt the archive desk, she found another book waiting with her name on a slip of paper.\n\nSomeone was leaving clues. The question was whether they wanted her to solve a mystery—or become part of it.`],
["Chapter 2: Numbers in the Margins",`The numbers led Ari to a shelf no one used. Behind a row of atlases, she found a photograph of the old library before its renovation.\n\nThree windows were circled in red. On the back, someone had written: “Look where the light never reaches.”\n\nAri switched on her flashlight and headed for the basement.`],
["Chapter 3: The Basement File",`Behind a cabinet, Ari discovered a thin folder marked with the same symbol as the book. Inside was a list of names, dates, and one name crossed out so hard the paper had torn.\n\nShe recognized the final name immediately: her own.\n\nFootsteps sounded on the stairs. Ari closed the folder and turned off her flashlight.`]]}
 ,
{ id:"neverheart", title:"I Was Never in Her Heart", genre:"Romance", symbol:"♡", desc:"It's about a guy drop-hinting in the group chat so the girl would know he likes her, but she's completely ignoring him.", chapters:[
["Chapter 1",`The story starts when the guy begins falling for the girl. At first, he thought it was nothing, but as time went on, he realized his feelings for her were real. The problem was that he couldn't confess to her directly. So instead, he expressed his feelings through quotes and emotional lines (hugot) in the group chat—hoping she would realize those words were meant for her.`]
]}
];
const $=id=>document.getElementById(id); let current=null, chapterIndex=0;
const coverThemes=[["#29224d","#9156a9","#f1a2ce"],["#30254e","#ad4e5c","#f7ba7d"],["#152e45","#3c82a2","#b2e4f4"],["#24364b","#647fa4","#e4c9d5"],["#4b244e","#b45c91","#ffd0a7"],["#17434a","#3d8a7a","#c9e6a2"],["#28202d","#743d58","#cf8a92"],["#1c2b4c","#4566a0","#a7b8ff"]];
function render(){const q=$('search').value.toLowerCase(), g=$('genre').value;const filtered=novels.filter(n=>(g==='All'||n.genre===g)&&(n.title+' '+n.desc+' '+n.genre).toLowerCase().includes(q));$('count').textContent=`${filtered.length} ${filtered.length===1?'story':'stories'}`;$('novels').innerHTML=filtered.map(n=>{const ix=novels.indexOf(n),c=coverThemes[ix];return `<article class="card"><div class="cover" style="background:linear-gradient(135deg,${c[0]},${c[1]} 58%,${c[2]})"><span>${n.symbol}</span></div><div class="cardbody"><span class="tag">${n.genre.toUpperCase()}</span><h3>${n.title}</h3><p>${n.desc}</p><div class="actions"><button class="primary" onclick="openNovel('${n.id}',0)">Read now</button><button onclick="openNovel('${n.id}',0)">Chapters (${n.chapters.length})</button></div></div></article>`}).join('');if(!filtered.length)$('novels').innerHTML='<div class="empty">No stories found. Try another search or genre.</div>'}
function openNovel(id,index=0){current=novels.find(n=>n.id===id);chapterIndex=index;$('reader').classList.add('active');$('readerGenre').textContent=current.genre;$('readerTitle').textContent=current.title;$('readerSubtitle').textContent=current.desc;$('chapterSelect').innerHTML=current.chapters.map((c,i)=>`<option value="${i}">${c[0]}</option>`).join('');showChapter();$('reader').scrollIntoView({behavior:'smooth',block:'start'})}
function showChapter(){if(!current)return;const c=current.chapters[chapterIndex];$('chapterSelect').value=chapterIndex;$('storyText').innerHTML=c[1].split('\n\n').map(p=>'<p>'+p.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')+'</p>').join('');$('chapterStatus').textContent=`Chapter ${chapterIndex+1} of ${current.chapters.length}`;$('prevTop').disabled=$('prevBottom').disabled=chapterIndex===0;$('nextTop').disabled=$('nextBottom').disabled=chapterIndex===current.chapters.length-1}
function moveChapter(delta){if(!current)return;const next=chapterIndex+delta;if(next>=0&&next<current.chapters.length){chapterIndex=next;showChapter();$('reader').scrollIntoView({behavior:'smooth',block:'start'})}}
$('search').addEventListener('input',render);$('genre').addEventListener('change',render);$('chapterSelect').addEventListener('change',e=>{chapterIndex=Number(e.target.value);showChapter()});['prevTop','prevBottom'].forEach(id=>$(id).addEventListener('click',()=>moveChapter(-1)));['nextTop','nextBottom'].forEach(id=>$(id).addEventListener('click',()=>moveChapter(1)));$('closeReader').addEventListener('click',()=>{$('reader').classList.remove('active');current=null});$('themeBtn').addEventListener('click',()=>{document.body.classList.toggle('light');$('themeBtn').textContent=document.body.classList.contains('light')?'🌙 Dark mode':'☀️ Light mode'});render();
</script>
</body>
</html>
